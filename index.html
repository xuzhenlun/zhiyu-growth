:root {
  color-scheme: light;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC",
    "Zhiyu Sans", "Roboto", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --background: #f5f5f7;
  --surface: #ffffff;
  --surface-subtle: #f8f8fa;
  --surface-blue: #f2f7ff;
  --surface-green: #eff8f5;
  --surface-amber: #fff8ec;
  --text-primary: #1d1d1f;
  --text-secondary: #48484a;
  --text-tertiary: #5f6066;
  --text-muted: #707076;
  --separator: #e5e5ea;
  --separator-strong: #d5d5da;
  --blue: #007aff;
  --blue-hover: #006ee6;
  --green: #1f7869;
  --green-soft: #e9f7f2;
  --amber: #94611a;
  --amber-soft: #fff6e7;
  --red: #c6534d;
  --red-soft: #fff0ee;
  --violet: #6e6bb3;
  --violet-soft: #f1f0fa;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.025);
  --shadow-md: 0 12px 30px rgba(25, 38, 52, 0.1);
  --shadow-phone: 0 24px 64px rgba(20, 35, 48, 0.16);
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

html {
  background: #eceff2;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  color: var(--text-primary);
  background:
    linear-gradient(rgba(35, 91, 123, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(35, 91, 123, 0.025) 1px, transparent 1px),
    #eceff2;
  background-size: 36px 36px;
  font-family: var(--font-sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
}

button,
input,
textarea,
select {
  color: inherit;
  font: inherit;
}

button,
select {
  cursor: pointer;
  touch-action: manipulation;
}

button {
  border: 0;
}

button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
  text-decoration: none;
}

svg {
  display: block;
}

::selection {
  color: #fff;
  background: var(--blue);
}

:focus-visible {
  outline: 3px solid rgba(0, 122, 255, 0.3);
  outline-offset: 2px;
}

.svg-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.page-atmosphere {
  display: none;
}

/* Desktop presentation */
.desktop-stage {
  display: grid;
  grid-template-columns: minmax(360px, 460px) 430px;
  align-items: center;
  justify-content: center;
  gap: clamp(54px, 7vw, 106px);
  width: min(1180px, calc(100% - 48px));
  min-height: 100vh;
  margin: 0 auto;
  padding: 20px 0;
}

.desktop-brand {
  align-self: center;
  padding: 26px 0;
}

.brand-mark {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.brand-symbol {
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  color: #fff;
  border-radius: 12px;
  background: var(--blue);
  font-size: 21px;
  font-weight: 600;
}

.brand-mark strong {
  display: block;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.brand-mark small {
  display: block;
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.04em;
}

.brand-mark--large .brand-symbol {
  width: 50px;
  height: 50px;
  border-radius: 14px;
  font-size: 24px;
}

.brand-mark--large strong {
  font-size: 20px;
}

.desktop-brand__copy {
  margin-top: clamp(60px, 9vh, 96px);
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 20px;
  color: #4c6374;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.eyebrow span {
  display: inline-block;
  width: 24px;
  height: 1px;
  background: #4c6374;
}

.desktop-brand h1 {
  margin: 0;
  color: #1d3f5b;
  font-size: clamp(36px, 3.2vw, 44px);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -0.045em;
  word-break: keep-all;
}

.desktop-brand h1::after {
  display: block;
  width: 72px;
  height: 3px;
  margin-top: 22px;
  border-radius: 99px;
  background: #8ec7c1;
  content: "";
}

.desktop-brand__intro {
  max-width: 430px;
  margin: 22px 0 0;
  color: var(--text-tertiary);
  font-size: 15px;
  line-height: 1.85;
}

.desktop-feature-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-top: 36px;
}

.desktop-feature-row div {
  padding: 13px;
  border: 1px solid var(--separator);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.72);
}

.desktop-feature-row strong,
.desktop-feature-row span {
  display: block;
}

.desktop-feature-row strong {
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
}

.desktop-feature-row span {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 10px;
}

.desktop-brand__foot {
  margin: 26px 0 0;
  color: var(--text-muted);
  font-size: 11px;
}

/* App shell */
.app-shell {
  position: relative;
  width: 100%;
  height: min(900px, calc(100dvh - 40px));
  min-height: 620px;
  overflow: hidden;
  border: 1px solid #d7dce2;
  border-radius: 32px;
  background: var(--background);
  box-shadow: var(--shadow-phone);
  isolation: isolate;
}

.app-shell::before {
  position: absolute;
  top: 9px;
  left: 50%;
  z-index: 30;
  width: 65px;
  height: 4px;
  border-radius: 99px;
  background: rgba(25, 32, 40, 0.14);
  content: "";
  transform: translateX(-50%);
}

.app-frame {
  display: flex;
  height: 100%;
  flex-direction: column;
  background: var(--background);
}

.boot-screen {
  display: grid;
  height: 100%;
  place-content: center;
  justify-items: center;
  padding: 28px;
  background: var(--background);
  text-align: center;
}

.boot-screen__mark {
  display: grid;
  width: 58px;
  height: 58px;
  margin-bottom: 16px;
  place-items: center;
  color: #fff;
  border-radius: 16px;
  background: var(--blue);
  font-size: 26px;
  font-weight: 600;
}

.boot-screen strong {
  font-size: 16px;
  font-weight: 600;
}

.boot-screen p {
  max-width: 280px;
  margin: 8px 0 0;
  color: var(--text-tertiary);
  font-size: 12px;
  line-height: 1.6;
}

/* Header and navigation */
.app-header {
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) 42px;
  align-items: center;
  min-height: 76px;
  padding: 18px 18px 10px;
  border-bottom: 1px solid var(--separator);
  background: rgba(255, 255, 255, 0.96);
}

.app-header__title {
  min-width: 0;
  text-align: center;
}

.app-header__title span {
  display: block;
  margin-bottom: 2px;
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 500;
}

.app-header__title strong {
  display: block;
  overflow: hidden;
  color: var(--text-primary);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-button,
.icon-button,
.back-link {
  display: grid;
  width: 40px;
  height: 40px;
  padding: 0;
  place-items: center;
  color: var(--text-secondary);
  border: 1px solid var(--separator);
  border-radius: 12px;
  background: #fff;
  transition:
    background 0.18s ease,
    transform 0.18s ease;
}

.header-button:hover,
.icon-button:hover,
.back-link:hover {
  background: var(--surface-subtle);
}

.header-button:active,
.icon-button:active,
.back-link:active {
  transform: scale(0.96);
}

.header-button svg,
.icon-button svg,
.back-link svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.role-switch {
  position: relative;
  display: grid;
  width: 40px;
  height: 40px;
  padding: 0;
  place-items: center;
  color: var(--blue);
  border: 1px solid var(--separator);
  border-radius: 12px;
  background: #f6f9ff;
}

.role-switch svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.role-switch::after {
  position: absolute;
  right: 1px;
  bottom: 1px;
  width: 7px;
  height: 7px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--green);
  content: "";
}

.page-scroll {
  flex: 1;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}

.page-scroll::-webkit-scrollbar {
  width: 0;
}

.page {
  min-height: 100%;
  padding: 18px 18px 42px;
  animation: page-enter 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}

.page--bottom-nav {
  padding-bottom: 106px;
}

@keyframes page-enter {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.bottom-nav {
  position: absolute;
  right: 14px;
  bottom: max(12px, env(safe-area-inset-bottom));
  left: 14px;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  min-height: 68px;
  padding: 7px 5px;
  border: 1px solid var(--separator);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  backdrop-filter: blur(16px);
}

.bottom-nav__item {
  display: flex;
  min-height: 52px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 4px;
  color: var(--text-muted);
  border-radius: 12px;
  background: transparent;
  font-size: 11px;
  font-weight: 500;
  transition:
    color 0.18s ease,
    background 0.18s ease;
}

.bottom-nav__item svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.bottom-nav__item.is-active {
  color: var(--blue);
  background: var(--surface-blue);
}

/* Shared typography and controls */
.pro-page-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 3px 2px 18px;
}

.pro-page-heading > div {
  min-width: 0;
  flex: 1;
}

.pro-page-heading--compact {
  padding-bottom: 16px;
}

.pro-page-heading h2 {
  margin: 8px 0 6px;
  color: var(--text-primary);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.04em;
}

.pro-page-heading p {
  margin: 0;
  color: var(--text-tertiary);
  font-size: 13px;
  line-height: 1.65;
}

.pro-kicker,
.page-intro__eyebrow {
  display: block;
  color: var(--text-tertiary);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.01em;
}

.pro-section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}

.pro-section-heading--spaced {
  margin: 22px 0 10px;
}

.pro-section-heading > div > span {
  display: block;
  margin-bottom: 5px;
  color: var(--text-muted);
  font-size: 10.5px;
  font-weight: 500;
}

.pro-section-heading h2 {
  margin: 0;
  color: var(--text-primary);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.pro-section-heading > small {
  color: var(--text-muted);
  font-size: 10px;
}

.page-intro {
  padding: 4px 2px 18px;
}

.page-intro__eyebrow {
  margin-bottom: 7px;
}

.page-intro h2 {
  margin: 0;
  color: var(--text-primary);
  font-size: 26px;
  font-weight: 700;
  line-height: 1.38;
  letter-spacing: -0.04em;
}

.page-intro p {
  margin: 8px 0 0;
  color: var(--text-tertiary);
  font-size: 12px;
  line-height: 1.7;
}

.pro-avatar {
  display: grid;
  width: 48px;
  height: 48px;
  flex: none;
  margin: 0;
  place-items: center;
  color: var(--blue);
  border: 1px solid var(--separator);
  border-radius: 14px;
  background: #fff;
  font-size: 18px;
  font-weight: 600;
}

.pro-avatar--teal {
  color: var(--green);
}

.pro-avatar--photo {
  width: 48px;
  height: 56px;
  padding: 0;
  overflow: hidden;
  border-color: #cfdce5;
  border-radius: 12px;
  background: #dcebf4;
}

.pro-avatar--photo img,
.avatar--photo img,
.student-avatar--photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}

.pro-avatar--institution svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.pro-note,
.inline-note {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-top: 13px;
  padding: 11px 12px;
  color: var(--text-tertiary);
  border: 1px solid var(--separator);
  border-radius: 12px;
  background: var(--surface);
  font-size: 10.5px;
  line-height: 1.65;
}

.pro-note svg,
.inline-note svg {
  flex: none;
  width: 15px;
  height: 15px;
  margin-top: 1px;
  fill: none;
  stroke: var(--blue);
  stroke-width: 1.8;
  stroke-linecap: round;
}

.pro-note--blue,
.inline-note--blue {
  color: #4c6578;
  border-color: #d8e5ed;
  background: #f3f8fb;
}

.pro-note--amber,
.inline-note--warning {
  color: #72572f;
  border-color: #eadfc9;
  background: var(--surface-amber);
}

.pro-note--amber svg,
.inline-note--warning svg {
  stroke: var(--amber);
}

.primary-button,
.outline-button,
.ghost-button,
.danger-button {
  display: inline-flex;
  min-height: 46px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 16px;
  border-radius: 13px;
  font-size: 12px;
  font-weight: 600;
  transition:
    background 0.18s ease,
    box-shadow 0.18s ease,
    transform 0.18s ease;
}

.primary-button {
  color: #fff;
  background: var(--blue);
}

.primary-button:hover {
  background: var(--blue-hover);
  box-shadow: 0 4px 14px rgba(0, 122, 255, 0.18);
}

.outline-button {
  color: var(--blue);
  border: 1px solid #cfe2f8;
  background: var(--surface-blue);
}

.ghost-button {
  color: var(--text-secondary);
  border: 1px solid var(--separator);
  background: #fff;
}

.danger-button {
  color: var(--red);
  background: var(--red-soft);
}

.primary-button:active,
.outline-button:active,
.ghost-button:active {
  transform: scale(0.98);
}

.primary-button svg,
.outline-button svg,
.ghost-button svg,
.danger-button svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.section-link {
  min-height: 34px;
  padding: 7px 0;
  color: var(--blue);
  background: transparent;
  font-size: 11px;
  font-weight: 500;
}

.sticky-action {
  position: sticky;
  bottom: 12px;
  z-index: 4;
  margin-top: 14px;
}

.sticky-action .primary-button {
  width: 100%;
}

/* Welcome */
.welcome-screen--pro {
  display: flex;
  height: 100%;
  flex-direction: column;
  overflow: hidden;
  background: var(--background);
}

.welcome-topbar {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: space-between;
  padding: 18px 18px 12px;
  border-bottom: 1px solid var(--separator);
  background: rgba(255, 255, 255, 0.96);
}

.welcome-topbar .brand-symbol {
  width: 42px;
  height: 42px;
  border-radius: 12px;
}

.text-button {
  display: inline-flex;
  min-height: 36px;
  align-items: center;
  gap: 4px;
  padding: 7px 11px;
  color: var(--blue);
  border: 1px solid var(--separator);
  border-radius: 11px;
  background: #fff;
  font-size: 11.5px;
  font-weight: 500;
}

.text-button svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
}

.pro-welcome-hero {
  flex: none;
  margin: 13px 14px 0;
}

.pro-welcome-hero__copy {
  padding: 18px;
  border: 1px solid var(--separator);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.pro-welcome-hero__topline {
  display: flex;
  min-height: 52px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.pro-welcome-hero__topline .pro-kicker {
  max-width: 230px;
}

.pro-welcome-hero__illustration {
  width: 72px;
  height: 52px;
  flex: none;
  object-fit: contain;
}

.pro-welcome-hero__copy h1 {
  margin: 9px 0;
  color: var(--text-primary);
  font-size: 31px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.045em;
}

.pro-welcome-hero__copy h1 strong {
  color: var(--blue);
  font-weight: 700;
}

.pro-welcome-hero__copy p {
  margin: 0;
  color: var(--text-tertiary);
  font-size: 13px;
  line-height: 1.7;
}

.pro-welcome-points {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.pro-welcome-points > span {
  display: flex;
  min-height: 69px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 9px 5px;
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  background: var(--surface);
  text-align: center;
}

.pro-welcome-points svg {
  width: 17px;
  height: 17px;
  margin-bottom: 5px;
  fill: none;
  stroke: var(--blue);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.pro-welcome-points strong {
  color: var(--text-primary);
  font-size: 11px;
  font-weight: 600;
}

.pro-welcome-points small {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 10.5px;
}

.pro-role-section {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  padding: 18px 14px 11px;
}

.role-list--compact {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.role-card {
  position: relative;
  display: flex;
  min-width: 0;
  min-height: 116px;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 10px;
  text-align: left;
  border: 1px solid var(--separator);
  border-radius: 15px;
  background: var(--surface);
  transition:
    border-color 0.18s ease,
    transform 0.18s ease;
}

.role-card:hover {
  border-color: #bcd7f2;
  transform: translateY(-1px);
}

.role-card__icon {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  color: var(--blue);
  border-radius: 10px;
  background: var(--surface-blue);
}

.role-card--teacher .role-card__icon {
  color: var(--green);
  background: var(--surface-green);
}

.role-card--college .role-card__icon {
  color: var(--amber);
  background: var(--surface-amber);
}

.role-card__icon svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.role-card__body {
  display: block;
  width: 100%;
}

.role-card__body strong,
.role-card__body span {
  display: block;
}

.role-card__body strong {
  margin-bottom: 4px;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
}

.role-card__body span {
  display: -webkit-box;
  overflow: hidden;
  color: var(--text-muted);
  font-size: 10.5px;
  line-height: 1.55;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.role-card__arrow {
  position: absolute;
  top: 11px;
  right: 9px;
  display: grid;
  width: 18px;
  height: 18px;
  place-items: center;
  color: #b0b0b5;
}

.role-card__arrow svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
}

.pro-welcome-workflow {
  display: flex;
  min-height: min(215px, 22vh);
  flex-direction: column;
  justify-content: space-between;
  margin-top: auto;
  padding: 13px 14px 12px;
  border: 1px solid var(--separator);
  border-radius: 16px;
  background: var(--surface);
}

.pro-welcome-workflow__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid #edf0f2;
}

.pro-welcome-workflow__head strong {
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
}

.pro-welcome-workflow__head span {
  color: var(--text-muted);
  font-size: 10px;
}

.pro-welcome-workflow__steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  padding: 12px 2px 10px;
}

.pro-welcome-workflow__steps > span {
  display: flex;
  min-width: 0;
  min-height: 84px;
  flex-direction: column;
  align-items: flex-start;
  padding: 8px;
  border-radius: 10px;
  background: var(--surface-subtle);
}

.pro-welcome-workflow__steps b {
  display: grid;
  width: 23px;
  height: 23px;
  place-items: center;
  color: var(--blue);
  border-radius: 7px;
  background: var(--surface-blue);
  font-size: 8px;
  font-weight: 600;
}

.pro-welcome-workflow__steps em {
  display: block;
  margin-top: 6px;
  color: var(--text-primary);
  font-size: 11px;
  font-style: normal;
  font-weight: 600;
}

.pro-welcome-workflow__steps small {
  display: -webkit-box;
  margin-top: 4px;
  overflow: hidden;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.5;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.pro-welcome-workflow p {
  margin: 0;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.55;
}

.page-heading-illustration {
  width: 92px;
  height: 72px;
  flex: none;
  object-fit: contain;
  object-position: center;
}

.page-heading-illustration--resource {
  width: 96px;
}

.page-heading-illustration--teacher {
  width: 88px;
}

.welcome-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--text-muted);
  font-size: 10px;
}

.welcome-footer::before,
.welcome-footer::after {
  width: 20px;
  height: 1px;

  .pro-role-section {

  }

  .role-card {

  .pro-welcome-workflow {

/* Shared cards and data blocks */
.pro-summary-card,
.pro-analysis-card,
.pro-action-panel,
.pro-list-panel,
.pro-dimension-panel,
.pro-insight-panel,
.pro-kpi-strip,
.pro-resource-list,
.chart-card,
.paper-card,
.metric-card,
.form-card,
.rule-card,
.indicator-card {

  border: 1px solid var(--separator);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.pro-summary-card,
.pro-analysis-card,
.pro-insight-panel,
.paper-card,
.form-card,
.rule-card {

}

.pro-summary-card__head,
.pro-analysis-card__head,
.chart-card__head,
.card-title-row {

  align-items: flex-start;

  gap: 12px;
}

.pro-summary-card__head > div > span,
.pro-analysis-card__head > div > span {
  display: block;
  color: var(--text-muted);
  font-size: 10.5px;
}

.pro-summary-card__head > div > strong {

  margin-top: 5px;
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
}

.pro-analysis-card__head h3,
.card-title-row h3 {
  margin: 0;
  color: var(--text-primary);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.45;
}

.pro-analysis-card__head h3 {
  margin-top: 5px;
}

.card-title-row p {
  margin: 5px 0 0;
  color: var(--text-tertiary);
  font-size: 11px;
  line-height: 1.65;
}

.pro-status {
  display: inline-flex;
  min-height: 26px;
  flex: none;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  color: var(--green);
  border-radius: 99px;
  background: var(--green-soft);
  font-size: 9.5px;
  font-weight: 500;
}

.pro-status i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--green);
}

.pro-summary-metrics,
.pro-kpi-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

.pro-summary-metrics {
  margin-top: 15px;
  padding: 14px 0;
  border-top: 1px solid #edf1f3;
  border-bottom: 1px solid #edf1f3;
}

.pro-kpi-strip {
  overflow: hidden;
  border: 1px solid var(--separator);
  border-radius: 16px;
  background: #fff;
}

.pro-summary-metrics div,
.pro-kpi-strip > div {
  padding: 0 9px;
  text-align: center;
}

.pro-kpi-strip > div {
  padding-top: 14px;
  padding-bottom: 14px;
}

.pro-summary-metrics div + div,
.pro-kpi-strip > div + div {
  border-left: 1px solid var(--separator);
}

.pro-summary-metrics strong,
.pro-summary-metrics span,
.pro-kpi-strip strong,
.pro-kpi-strip span {
  display: block;
}

.pro-summary-metrics strong,
.pro-kpi-strip strong {
  color: var(--text-primary);
  font-size: 24px;
  font-weight: 600;
}

.pro-kpi-strip strong {
  font-size: 26px;
}

.pro-summary-metrics span,
.pro-kpi-strip span {
  margin-top: 4px;
  color: var(--text-tertiary);
  font-size: 10.5px;
}

.pro-summary-lines {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.pro-summary-lines > span {
  display: grid;
  grid-template-columns: 94px 1fr;
  align-items: center;
  gap: 9px;
}

.pro-summary-lines em {
  color: var(--text-secondary);
  font-size: 10.5px;
  font-style: normal;
}

.pro-summary-lines i,
.pro-dimension-row__bar,
.bar-track {
  display: block;
  height: 6px;
  overflow: hidden;
  border-radius: 99px;
  background: #e8eaed;
}

.pro-summary-lines b,
.pro-dimension-row__bar i,
.bar-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--blue);
}

.pro-summary-card__note {
  margin: 13px 0 0;
  color: var(--text-tertiary);
  font-size: 10.5px;
  line-height: 1.6;
}

.pro-action-panel,
.pro-list-panel,
.pro-dimension-panel,
.pro-resource-list {
  padding: 0;
}

.pro-action-row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto 18px;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-height: 78px;
  padding: 12px 13px;
  text-align: left;
  border-top: 1px solid #edf1f3;
  background: var(--surface);
}

.pro-action-row:first-child {
  border-top: 0;
}

.pro-action-row--primary {
  background: var(--surface-subtle);
}

.pro-action-row__icon {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  color: var(--blue);
  border-radius: 11px;
  background: var(--surface-blue);
}

.pro-action-row:nth-child(2) .pro-action-row__icon {

  background: var(--green-soft);
}

.pro-action-row:nth-child(3) .pro-action-row__icon {
  color: var(--amber);

}

.pro-action-row:nth-child(4) .pro-action-row__icon {

  background: var(--red-soft);
}

.pro-action-row__icon svg {

  stroke-width: 1.7;

  stroke-linejoin: round;
}

.pro-action-row__copy {
  min-width: 0;
}

.pro-action-row__copy strong,
.pro-action-row__copy span {
  display: block;
}

.pro-action-row__copy strong {
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
}

.pro-action-row__copy span {
  margin-top: 4px;
  overflow: hidden;
  color: var(--text-tertiary);
  font-size: 10.5px;
  line-height: 1.5;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pro-action-row__meta {
  color: var(--text-muted);
  font-size: 10px;
  white-space: nowrap;
}

.pro-action-row__arrow,
.pro-record-row__arrow {
  display: grid;
  width: 18px;
  height: 18px;
  place-items: center;
  color: #a2a2a7;
}

.pro-action-row__arrow svg,
.pro-record-row__arrow svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
}

/* Student archive */
.pro-upload-row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) 32px;
  align-items: center;
  gap: 10px;
  width: 100%;

  padding: 12px 13px;

}

.pro-upload-row > span:first-child {
  display: grid;

  height: 40px;
  place-items: center;
  color: var(--blue);
  border-radius: 10px;
  background: #fff;
}

.pro-upload-row svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
}

.pro-upload-row strong,
.pro-upload-row small {
  display: block;
}

.pro-upload-row strong {
  color: var(--text-primary);

  font-weight: 600;
}

.pro-upload-row small {
  margin-top: 4px;
  color: var(--text-muted);

}

.pro-upload-row em {

.pro-category-grid button:last-child {

}

.pro-category-grid button > span {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  color: var(--blue);
  border-radius: 9px;

}

.pro-category-grid svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
}

.pro-category-grid strong {
  overflow: hidden;
  color: var(--text-primary);
  font-size: 12.5px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pro-category-grid em {
  color: var(--text-muted);
  font-size: 10px;
  font-style: normal;
}

.pro-record-row {
  display: grid;
  grid-template-columns: 39px minmax(0, 1fr) auto 18px;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 74px;
  padding: 11px 12px;
  text-align: left;
  border-top: 1px solid #edf1f3;
  background: var(--surface);
}

.pro-record-row:first-child {
  border-top: 0;
}

.pro-record-row__icon {
  display: grid;
  width: 39px;
  height: 39px;
  place-items: center;
  color: var(--blue);
  border-radius: 10px;
  background: var(--surface-blue);
}

.pro-record-row__icon svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
}

.pro-record-row__copy {
  min-width: 0;
}

.pro-record-row__copy strong,
.pro-record-row__copy small {
  display: block;
}

.pro-record-row__copy strong {
  overflow: hidden;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pro-record-row__copy small {
  margin-top: 4px;
  overflow: hidden;
  color: var(--text-tertiary);
  font-size: 10.5px;

}

.pro-record-row__meta {
  text-align: right;
}

.pro-record-row__meta em,
.pro-record-row__meta i {

  font-style: normal;
}

.pro-record-row__meta em {
  color: var(--text-tertiary);
}

.pro-record-row__meta i {
  margin-top: 3px;
  color: var(--green);
}

/* Profile analysis */
.pro-radar-box {
  margin: 0 -4px -6px;
}

.radar-wrap {
  width: 100%;

  margin: 0 auto;
}

.radar-chart {
  width: 100%;
  height: 100%;
}

.radar-chart__grid {
  fill: none;
  stroke: #dce8ee;
  stroke-width: 1;
}

.radar-chart__axis {
  stroke: #e4edf1;
  stroke-width: 1;
}

.radar-chart__shape {
  fill: rgba(0, 122, 255, 0.14);
  stroke: var(--blue);
  stroke-width: 2;
}

.radar-chart__point {
  fill: #fff;
  stroke: var(--blue);
  stroke-width: 2;
}

.radar-chart__label {
  fill: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 500;
}

.pro-radar-legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  padding-top: 11px;
  border-top: 1px solid #edf1f3;
}

.pro-radar-legend span {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-tertiary);
  font-size: 10.5px;
}

.pro-radar-legend i {
  width: 6px;
  height: 6px;
  border-radius: 2px;
}

.pro-radar-legend .c-blue {
  background: var(--blue);
}

.pro-radar-legend .c-teal {
  background: var(--green);
}

.pro-radar-legend .c-gold {
  background: var(--amber);
}

.pro-radar-legend .c-violet {
  background: var(--violet);
}

.pro-analysis-card__summary {
  margin: 12px 0 0;
  padding: 10px 11px;
  color: var(--text-secondary);
  border-radius: 10px;
  background: var(--surface-subtle);
  font-size: 10.5px;
  line-height: 1.65;
}

.pro-dimension-row {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) 82px;
  align-items: center;
  gap: 10px;

  padding: 10px 12px;
  border-top: 1px solid #edf1f3;
}

.pro-dimension-row:first-child {
  border-top: 0;
}

.pro-dimension-row__icon {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  color: var(--blue);
  border-radius: 9px;
  background: var(--surface-blue);
  font-size: 9px;
  font-weight: 600;
}

.pro-dimension-row__copy strong,
.pro-dimension-row__copy small {
  display: block;
}

.pro-dimension-row__copy strong {
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 500;
}

.pro-dimension-row__copy small {
  margin-top: 4px;
  overflow: hidden;
  color: var(--text-tertiary);
  font-size: 10.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pro-insight-list {
  display: grid;
  gap: 9px;
}

.pro-insight-list article {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 11px;
  padding: 13px;
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.pro-insight-list article > span {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  color: var(--blue);
  border-radius: 9px;
  background: var(--surface-blue);
}

.pro-insight-list article:nth-child(2) > span {
  color: var(--amber);
  background: var(--surface-amber);
}

.pro-insight-list article:nth-child(3) > span {
  color: var(--green);
  background: var(--surface-green);
}

.pro-insight-list svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.pro-insight-list strong {
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 600;
}

.pro-insight-list p {
  margin: 5px 0 0;
  color: var(--text-tertiary);
  font-size: 10.5px;
  line-height: 1.7;
}

.pro-filter-tabs {
  display: flex;
  gap: 7px;

  margin: 0 -18px;
  padding: 0 18px 4px;
  scrollbar-width: none;
}

.pro-filter-tabs::-webkit-scrollbar {

}

.filter-chip {

.filter-chip.is-active {

.pro-feature-resource {

  border: 1px solid var(--separator);
  border-radius: 16px;
  background: var(--surface);
}

.pro-feature-resource__icon {
  display: grid;
  width: 54px;
  height: 54px;
  place-items: center;
  color: var(--blue);
  border-radius: 13px;
  background: var(--surface-blue);
}

.pro-feature-resource__icon svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
}

.pro-feature-resource__copy small,
.pro-feature-resource__copy strong,
.pro-feature-resource__copy > span {
  display: block;
}

.pro-feature-resource__copy small {
  color: var(--green);
  font-size: 10.5px;
}

.pro-feature-resource__copy strong {
  margin-top: 5px;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
}

.pro-feature-resource__copy > span {
  margin-top: 4px;
  color: var(--text-tertiary);
  font-size: 10.5px;
  line-height: 1.55;
}

.pro-feature-resource__arrow,
.pro-resource-row__arrow {

  width: 18px;

  color: #a2a2a7;
}

.pro-feature-resource__arrow svg,
.pro-resource-row__arrow svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;

.pro-resource-list {
  margin-top: 9px;
}

.pro-resource-row {

  grid-template-columns: 38px minmax(0, 1fr) 18px;

  gap: 10px;

  padding: 11px 12px;

  border-top: 1px solid #edf1f3;

.pro-resource-row:first-child {
  border-top: 0;
}

.pro-resource-row__icon {
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  color: var(--blue);
  border-radius: 10px;
  background: var(--surface-blue);
}

.pro-resource-row__icon svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
}

.pro-resource-row__copy small,
.pro-resource-row__copy strong,
.pro-resource-row__copy > span {
  display: block;
}

.pro-resource-row__copy small {
  color: var(--green);
  font-size: 10.5px;
}

.pro-resource-row__copy strong {
  margin-top: 4px;
  color: var(--text-primary);
  font-size: 12.5px;

.pro-resource-row__copy > span {

.pro-footnote {

/* Reflection */
.reflection-progress {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 14px;
  margin-bottom: 13px;
  padding: 15px;
  border: 1px solid #d7e5ef;
  border-radius: var(--radius-lg);
  background: var(--surface-blue);
}

.reflection-progress strong,
.reflection-progress span {
  display: block;
}

.reflection-progress strong {
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
}

.reflection-progress span {
  margin-top: 4px;
  color: var(--text-tertiary);
  font-size: 10.5px;
  line-height: 1.5;
}

.progress-ring {
  position: relative;
  display: grid;
  width: 50px;
  height: 50px;
  place-items: center;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 600;
}

.progress-ring::before {
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: #fff;
  content: "";
}

.progress-ring span {
  position: relative;
  margin: 0;
  color: var(--blue);
  font-size: 11px;
}

.reflection-list {
  display: grid;
  gap: 10px;
}

.reflection-card {
  overflow: hidden;
  border: 1px solid var(--separator);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.reflection-card__head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 15px 11px;
}

.reflection-index {
  display: grid;
  width: 30px;
  height: 30px;
  flex: none;
  place-items: center;
  color: var(--blue);
  border-radius: 9px;
  background: var(--surface-blue);
  font-size: 9px;
  font-weight: 600;
}

.reflection-card__head strong,
.reflection-card__head span {
  display: block;
}

.reflection-card__head strong {
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 600;
}

.reflection-card__head span {
  margin-top: 4px;
  color: var(--text-tertiary);
  font-size: 10.5px;
  line-height: 1.55;
}

.reflection-card textarea,
.form-textarea {
  display: block;
  width: calc(100% - 30px);
  min-height: 92px;
  margin: 0 15px 8px;
  padding: 12px;
  resize: vertical;
  color: var(--text-primary);
  border: 1px solid var(--separator);
  border-radius: 12px;
  outline: 0;
  background: var(--surface-subtle);
  font-size: 12px;
  line-height: 1.7;
  transition:
    border-color 0.18s ease,
    box-shadow 0.18s ease;
}

.form-textarea {
  width: 100%;
  min-height: 128px;
  margin: 0;
}

.reflection-card textarea:focus,
.form-textarea:focus {
  border-color: #8ec4fa;
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
}

.reflection-card textarea::placeholder,
.form-textarea::placeholder {
  color: #a0a0a5;
}

.field-meta {
  display: flex;
  justify-content: flex-end;
  padding: 0 15px 11px;
  color: var(--text-muted);
  font-size: 9.5px;
}

/* Student profile */
.profile-head {
  padding: 20px;
  color: #fff;
  border-radius: var(--radius-xl);
  background: linear-gradient(145deg, #24516f, #356f83);
}

.portrait-disclaimer {
  margin: 8px 4px 0;
  color: var(--text-muted);
  font-size: 9.5px;
  line-height: 1.5;
  text-align: center;
}

.profile-head__identity {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  display: grid;
  width: 48px;
  height: 48px;
  flex: none;
  place-items: center;
  color: var(--blue);
  border-radius: 14px;
  background: #fff;
  font-size: 19px;
  font-weight: 600;
}

.avatar--photo {
  padding: 0;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.78);
  background: #dcebf4;
}

.profile-head__identity .avatar {
  width: 58px;
  height: 70px;
  color: #24516f;
  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: 14px;
  background: #edf7f8;
  font-size: 23px;
  font-weight: 600;
}

.profile-head__identity > span:not(.avatar) {
  display: block;
  min-width: 0;
  color: #fff;
}

.profile-head__identity strong {
  display: block;
  color: #fff;
  font-size: 21px;
  font-weight: 600;
}

.profile-head__identity > span:not(.avatar) > span {
  display: block;
  margin-top: 5px;
  color: rgba(255, 255, 255, 0.68);
  font-size: 10.5px;
  line-height: 1.5;
}

.profile-head__stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
}

.profile-head__stats div {
  text-align: center;
}

.profile-head__stats strong,
.profile-head__stats span {
  display: block;
}

.profile-head__stats strong {
  color: #fff;
  font-size: 19px;
  font-weight: 600;
}

.profile-head__stats span {
  margin-top: 4px;
  color: rgba(255, 255, 255, 0.68);
  font-size: 10px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 22px 2px 10px;
}

.section-heading h3 {
  margin: 0;
  color: var(--text-primary);
  font-size: 18px;
  font-weight: 600;
}

.section-heading p {
  margin: 4px 0 0;
  color: var(--text-tertiary);
  font-size: 10.5px;
}

.menu-list {
  overflow: hidden;
  border: 1px solid var(--separator);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.menu-row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 66px;
  padding: 12px 14px;
  text-align: left;
  border-top: 1px solid #edf1f3;
  background: var(--surface);
}

.menu-row:first-child {
  border-top: 0;
}

.menu-row__icon {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  color: var(--blue);
  border-radius: 11px;
  background: var(--surface-blue);
}

.menu-row__icon svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.menu-row__copy {
  min-width: 0;
}

.menu-row__copy strong,
.menu-row__copy span {
  display: block;
}

.menu-row__copy strong {
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
}

.menu-row__copy span {
  margin-top: 4px;
  overflow: hidden;
  color: var(--text-tertiary);
  font-size: 10.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.menu-row__arrow {
  display: grid;
  width: 18px;
  height: 18px;
  place-items: center;
  color: #a2a2a7;
}

.menu-row__arrow svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
}

.paper-card {
  color: var(--text-secondary);
}

.back-to-start {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 10px;
  color: var(--blue);
  background: transparent;
  font-size: 10.5px;
  font-weight: 500;
}

/* Teacher */
.pro-alert {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  margin-top: 11px;
  padding: 11px 12px;
  color: #72572f;
  border: 1px solid #eadfc9;
  border-radius: 13px;
  background: var(--surface-amber);
}

.pro-alert > span {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  color: var(--amber);
  border-radius: 9px;
  background: #f7ead0;
}

.pro-alert svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
}

.pro-alert strong {
  display: block;
  color: #62471f;
  font-size: 12px;
  font-weight: 600;
}

.pro-alert p {
  margin: 3px 0 0;
  color: #816943;
  font-size: 10px;
  line-height: 1.5;
}

.pro-alert button {
  min-height: 32px;
  padding: 6px 9px;
  color: #75551f;
  border-radius: 8px;
  background: #f5e7cc;
  font-size: 9.5px;
  font-weight: 500;
}

.pro-insight-strip,
.insight-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.pro-insight-strip > div,
.insight-mini {
  padding: 13px;
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.pro-insight-strip span,
.pro-insight-strip strong,
.pro-insight-strip small,
.insight-mini small,
.insight-mini strong,
.insight-mini p {
  display: block;
}

.pro-insight-strip span,
.insight-mini small {
  color: var(--text-muted);
  font-size: 10px;
}

.pro-insight-strip strong,
.insight-mini strong {
  margin-top: 5px;
  color: var(--text-primary);
  font-size: 22px;
  font-weight: 600;
}

.insight-mini strong {
  font-size: 13px;
  font-weight: 600;
}

.pro-insight-strip small {
  margin-top: 3px;
  color: var(--text-tertiary);
  font-size: 10px;
}

.insight-mini p {
  margin: 5px 0 0;
  color: var(--text-tertiary);
  font-size: 10px;
  line-height: 1.55;
}

/* Teacher material review */
.selector-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 11px;
}

.select-field,
.input-field {
  display: block;
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0 12px;
  color: var(--text-primary);
  border: 1px solid var(--separator);
  border-radius: 12px;
  outline: 0;
  background: #fff;
  font-size: 11px;
}

.select-field:focus,
.input-field:focus {
  border-color: #8ec4fa;
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
}

.teacher-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 12px;
}

.metric-card {
  padding: 14px;
  border-radius: var(--radius-md);
}

.metric-card span,
.metric-card strong {
  display: block;
}

.metric-card span {
  color: var(--text-muted);
  font-size: 10px;
}

.metric-card strong {
  margin-top: 6px;
  color: var(--text-primary);
  font-size: 23px;
  font-weight: 600;
}

.metric-card strong small {
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 400;
}

.table-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 16px 2px 9px;
}

.table-heading h3 {
  margin: 0;
  color: var(--text-primary);
  font-size: 16px;
  font-weight: 600;
}

.table-heading span {
  color: var(--text-muted);
  font-size: 9.5px;
}

.material-list {
  display: grid;
  gap: 8px;
}

.material-item {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  align-items: start;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.student-avatar {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  color: var(--blue);
  border-radius: 11px;
  background: var(--surface-blue);
  font-size: 13px;
  font-weight: 600;
}

.student-avatar--photo {
  width: 46px;
  height: 54px;
  padding: 0;
  overflow: hidden;
  border: 1px solid #d5e2ea;
  border-radius: 10px;
  background: #dcebf4;
}

.material-item__body {
  min-width: 0;
}

.material-item__title {
  display: flex;
  align-items: center;
  gap: 6px;
}

.material-item__title strong {
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 600;
}

.material-item__title span {
  color: var(--text-muted);
  font-size: 10px;
}

.material-item__body > p {
  margin: 5px 0 8px;
  color: var(--text-muted);
  font-size: 10px;
}

.tag-line {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tag-pill {
  display: inline-flex;
  min-height: 22px;
  align-items: center;
  padding: 3px 7px;
  color: #386888;
  border: 1px solid #d7e6ef;
  border-radius: 7px;
  background: #f2f8fb;
  font-size: 9px;
  font-weight: 500;
}

.tag-pill--teal {
  color: var(--green);
  border-color: #d1e8df;
  background: var(--green-soft);
}

.tag-pill--amber {
  color: #8c6428;
  border-color: #ecdfc6;
  background: var(--amber-soft);
}

.tag-edit-button {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  color: var(--blue);
  border: 1px solid var(--separator);
  border-radius: 9px;
  background: #fff;
  font-size: 10px;
  font-weight: 500;
  white-space: nowrap;
}

.tag-edit-button svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
}

.tag-lib {
  margin-top: 12px;
  padding: 14px;
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  background: var(--surface-subtle);
}

.tag-lib > strong {
  display: block;
  margin-bottom: 9px;
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
}

.tag-lib__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* Teacher feedback */
.feedback-student {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 12px;
  padding: 13px;
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.feedback-student .student-avatar {
  width: 48px;
  height: 56px;
}

.feedback-student strong,
.feedback-student span {
  display: block;
}

.feedback-student strong {
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 600;
}

.feedback-student span {
  margin-top: 4px;
  color: var(--text-tertiary);
  font-size: 10px;
}

.feedback-student__badge {
  margin-left: auto;
}

.soft-badge {
  display: inline-flex;
  min-height: 26px;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  color: var(--blue);
  border-radius: 99px;
  background: var(--surface-blue);
  font-size: 9.5px;
  font-weight: 500;
}

.soft-badge svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
}

.soft-badge--teal {
  color: var(--green);
  background: var(--green-soft);
}

.soft-badge--amber {
  color: var(--amber);
  background: var(--amber-soft);
}

.score-ban {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-bottom: 12px;
  padding: 12px;
  color: #72572f;
  border: 1px solid #eadfc9;
  border-radius: var(--radius-md);
  background: var(--surface-amber);
  font-size: 10.5px;
  line-height: 1.65;
}

.score-ban svg {
  flex: none;
  width: 16px;
  height: 16px;
  margin-top: 1px;
  fill: none;
  stroke: var(--amber);
  stroke-width: 1.8;
  stroke-linecap: round;
}

.form-card {
  padding: 15px;
}

.form-card + .form-card {
  margin-top: 10px;
}

.form-card__label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
}

.form-card__label strong {
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
}

.form-card__label span {
  color: var(--text-muted);
  font-size: 10.5px;
}

.quick-phrases {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
}

.quick-phrases button {
  min-height: 32px;
  padding: 6px 9px;
  color: var(--text-secondary);
  border: 1px solid var(--separator);
  border-radius: 8px;
  background: var(--surface-subtle);
  font-size: 10px;
}

/* Charts and statistics */
.class-pulse-hero-v2 {
  position: relative;
  min-height: 198px;
  overflow: hidden;
  padding: 20px;
  border: 1px solid var(--separator);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.class-pulse-hero-v2 > div:first-child > span {
  color: var(--text-muted);
  font-size: 10.5px;
}

.class-pulse-hero-v2 > div:first-child > strong {
  display: block;
  margin-top: 13px;
  color: var(--text-primary);
  font-size: 52px;
  font-weight: 600;
  line-height: 0.95;
  letter-spacing: -0.04em;
}

.class-pulse-hero-v2 > div:first-child > strong small {
  font-size: 20px;
}

.class-pulse-hero-v2 > div:first-child > p {
  max-width: 240px;
  margin: 13px 0 0;
  color: var(--text-tertiary);
  font-size: 10.5px;
  line-height: 1.6;
}

.class-pulse-hero-v2__tag {
  position: absolute;
  top: 18px;
  right: 18px;
  padding: 5px 8px;
  color: var(--green);
  border-radius: 99px;
  background: var(--green-soft);
  font-size: 9.5px;
}

.class-pulse-wave-v2 {
  position: absolute;
  right: 17px;
  bottom: 17px;
  display: flex;
  height: 85px;
  align-items: flex-end;
  gap: 6px;
}

.class-pulse-wave-v2 i {
  display: block;
  width: 7px;
  border-radius: 7px;
  background: linear-gradient(to top, #dbeaf1, #5f97b5);
}

.class-pulse-wave-v2 i:nth-child(1) {
  height: 29px;
}

.class-pulse-wave-v2 i:nth-child(2) {
  height: 48px;
}

.class-pulse-wave-v2 i:nth-child(3) {
  height: 39px;
}

.class-pulse-wave-v2 i:nth-child(4) {
  height: 67px;
}

.class-pulse-wave-v2 i:nth-child(5) {
  height: 52px;
}

.class-pulse-wave-v2 i:nth-child(6) {
  height: 76px;
}

.class-pulse-wave-v2 i:nth-child(7) {
  height: 63px;
}

.class-quick-stats-v2 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0 12px;
}

.class-quick-stats-v2 > span {
  padding: 12px 10px;
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.class-quick-stats-v2 b,
.class-quick-stats-v2 small {
  display: block;
}

.class-quick-stats-v2 b {
  color: var(--text-primary);
  font-size: 18px;
  font-weight: 600;
}

.class-quick-stats-v2 small {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 10px;
}

.chart-card {
  padding: 16px;
}

.chart-card + .chart-card {
  margin-top: 10px;
}

.chart-card__head {
  margin-bottom: 12px;
}

.chart-card__head h3 {
  margin: 0;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
}

.chart-card__head p {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 10px;
}

.chart-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  font-size: 9px;
}

.chart-legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.chart-legend span::before {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--blue);
  content: "";
}

.activity-bars {
  display: grid;
  gap: 13px;
}

.activity-bar__meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
  color: var(--text-tertiary);
  font-size: 10px;
}

.activity-bar__meta strong {
  color: var(--text-primary);
  font-size: 10.5px;
  font-weight: 500;
}

.activity-bar:nth-child(2) .bar-track span {
  background: var(--green);
}

.activity-bar:nth-child(3) .bar-track span {
  background: var(--amber);
}

.activity-bar:nth-child(4) .bar-track span {
  background: var(--violet);
}

.line-chart {
  width: 100%;
  height: auto;
}

.line-chart__grid {
  stroke: #e6edef;
  stroke-width: 1;
}

.line-chart__area {
  fill: rgba(0, 122, 255, 0.08);
}

.line-chart__line {
  fill: none;
  stroke: var(--blue);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2.2;
}

.line-chart__dot {
  fill: #fff;
  stroke: var(--blue);
  stroke-width: 2;
}

.line-chart__label {
  fill: var(--text-muted);
  font-family: var(--font-sans);
  font-size: 10px;
}

.gauge-row {
  display: grid;
  grid-template-columns: 116px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
}

.donut-chart {
  position: relative;
  width: 106px;
  height: 106px;
  border-radius: 50%;
  background: conic-gradient(
    var(--blue) 0 34%,
    var(--green) 34% 63%,
    var(--amber) 63% 83%,
    var(--violet) 83% 100%
  );
}

.donut-chart::before {
  position: absolute;
  inset: 15px;
  border-radius: 50%;
  background: #fff;
  content: "";
}

.donut-chart__center {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
}

.donut-chart__center strong {
  color: var(--text-primary);
  font-size: 18px;
  font-weight: 600;
}

.donut-chart__center span {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 9px;
}

.donut-legend {
  display: grid;
  gap: 9px;
}

.donut-legend__item {
  display: grid;
  grid-template-columns: 7px minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  color: var(--text-tertiary);
  font-size: 10px;
}

.donut-legend__item i {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--blue);
}

.donut-legend__item:nth-child(2) i {
  background: var(--green);
}

.donut-legend__item:nth-child(3) i {
  background: var(--amber);
}

.donut-legend__item:nth-child(4) i {

    try {

    } catch {

  function readSelectedRole() {
    try {

    }

    }

  function loadState() {
    try {
      const data = safeParse(window.localStorage.getItem("zhiyu-growth-state"), {});
      return data && typeof data === "object" ? data : {};
    } catch {
      // Some Android browsers block Web Storage for local file:// pages.
      storageAvailable = false;
      return {};
    }
  }

  function saveState() {
    try {
      window.localStorage.setItem(
        "zhiyu-growth-state",
        JSON.stringify({
          reflection: state.reflection,
          indicatorTags: state.indicatorTags,
          openIndicators: [...state.openIndicators],
          rules: state.rules,
          studentTags: state.studentTags,
        }),
      );
      storageAvailable = true;
      return true;
    } catch {
      // Keep the app usable in memory when local file storage is restricted.
      storageAvailable = false;
      return false;
    }

      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")

      .replaceAll("'", "&#039;");

  function renderMiniRadar() {
    const cx = 55;
    const cy = 55;
    const radius = 34;
    const values = [0.68, 0.6, 0.76, 0.8];
    const rings = [0.35, 0.58, 0.8, 1]
      .map((level) => {
        const points = diamondPoints(cx, cy, radius * level);
        return `<polygon points="${points}" fill="none" stroke="rgba(255,255,255,${level === 1 ? 0.35 : 0.18})" stroke-width="0.8" />`;
      })
      .join("");
    const dataPoints = axisPolygon(cx, cy, radius, values);
    return `
      <svg class="mini-radar" viewBox="0 0 110 110" aria-label="四维画像迷你雷达图">
        ${rings}
        <line x1="${cx}" y1="${cy - radius}" x2="${cx}" y2="${cy + radius}" stroke="rgba(255,255,255,.18)" />
        <line x1="${cx - radius}" y1="${cy}" x2="${cx + radius}" y2="${cy}" stroke="rgba(255,255,255,.18)" />
        <polygon points="${dataPoints}" fill="rgba(154,231,218,.25)" stroke="#9ae7da" stroke-width="1.5" />
        <circle cx="${cx}" cy="${cy}" r="2" fill="#d7fff6" />
      </svg>
    `;
  }

  function diamondPoints(cx, cy, radius) {
    return [
      [cx, cy - radius],
      [cx + radius, cy],
      [cx, cy + radius],
      [cx - radius, cy],
    ]
      .map((point) => point.join(","))
      .join(" ");
  }

  function axisPolygon(cx, cy, radius, values) {
    return [
      [cx, cy - radius * values[0]],
      [cx + radius * values[1], cy],
      [cx, cy + radius * values[2]],
      [cx - radius * values[3], cy],
    ]
      .map((point) => point.map((value) => value.toFixed(1)).join(","))
      .join(" ");
  }

  function renderFullRadar() {
    const cx = 180;
    const cy = 127;
    const radius = 78;
    const values = [0.72, 0.66, 0.79, 0.81];
    const levels = [0.25, 0.5, 0.75, 1];
    const grid = levels
      .map(
        (level) =>
          `<polygon class="radar-chart__grid" points="${diamondPoints(cx, cy, radius * level)}" />`,
      )
      .join("");
    const axis = `
      <line class="radar-chart__axis" x1="${cx}" y1="${cy - radius}" x2="${cx}" y2="${cy + radius}" />
      <line class="radar-chart__axis" x1="${cx - radius}" y1="${cy}" x2="${cx + radius}" y2="${cy}" />
    `;
    const dataPoints = [
      [cx, cy - radius * values[0]],
      [cx + radius * values[1], cy],
      [cx, cy + radius * values[2]],
      [cx - radius * values[3], cy],
    ];
    return `
      <svg class="radar-chart" viewBox="0 0 360 252" role="img" aria-label="创新能力四维雷达图">
        ${grid}
        ${axis}
        <polygon class="radar-chart__shape" points="${dataPoints.map((point) => point.map((value) => value.toFixed(1)).join(",")).join(" ")}" />
        ${dataPoints.map((point) => `<circle class="radar-chart__point" cx="${point[0].toFixed(1)}" cy="${point[1].toFixed(1)}" r="3" />`).join("")}
        <text class="radar-chart__label" x="${cx}" y="25" text-anchor="middle">意识与动机</text>
        <text class="radar-chart__label" x="346" y="${cy + 3}" text-anchor="end">思维与方法</text>
        <text class="radar-chart__label" x="${cx}" y="238" text-anchor="middle">精神与品格</text>
        <text class="radar-chart__label" x="14" y="${cy + 3}" text-anchor="start">实践创新</text>
      </svg>
    `;
  }

          <span class="menu-row__copy"><strong>${title}</strong><span>${subtitle}</span></span>
          <span class="menu-row__arrow">${icon("chevron-right")}</span>
        </button>
      `;

      <button class="menu-row" type="button" data-demo-message="${demoMessage}">
        <span class="menu-row__icon">${icon(iconName)}</span>

    `;
  }

  function renderMaterialItem(student, index) {
    const tags = state.studentTags[student.id] || [];
    return `
      <article class="material-item">
        <span class="student-avatar student-avatar--photo">
          <img src="${student.portrait}" alt="${student.name}演示头像" />
        </span>
        <span class="material-item__body">
          <span class="material-item__title"><strong>${student.name}</strong><span>${student.type}</span></span>
          <p>${student.time} · 材料编号 SY-${String(index + 1).padStart(3, "0")}</p>
          <span class="tag-line">
            ${tags
              .map(
                (tag, tagIndex) =>
                  `<span class="tag-pill${tagIndex % 3 === 1 ? " tag-pill--teal" : tagIndex % 3 === 2 ? " tag-pill--amber" : ""}">${escapeHTML(tag)}</span>`,
              )
              .join("") || '<span class="tag-pill">待添加标签</span>'}
          </span>
        </span>
        <button class="tag-edit-button" type="button" data-edit-tags="${student.id}">
          ${icon("edit")} 修改
        </button>
      </article>
    `;
  }

  function buildQrCode() {
    const target = document.querySelector("#qr-code");
    if (!target) return;
    const size = 29;
    let seed = 20261106;
    const random = () => {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
    const modules = Array.from({ length: size }, () => Array(size).fill(false));

    const finder = (ox, oy) => {
      for (let y = 0; y < 7; y += 1) {
        for (let x = 0; x < 7; x += 1) {
          const edge = x === 0 || y === 0 || x === 6 || y === 6;
          const core = x >= 2 && x <= 4 && y >= 2 && y <= 4;
          modules[oy + y][ox + x] = edge || core;
        }
      }
    };

    for (let y = 0; y < size; y += 1) {
      for (let x = 0; x < size; x += 1) {
        const inFinder =
          (x < 8 && y < 8) ||
          (x > size - 9 && y < 8) ||
          (x < 8 && y > size - 9) ||
          (x >= 12 && x <= 16 && y >= 12 && y <= 16);
        modules[y][x] = inFinder ? false : random() > 0.53;
      }
    }
    finder(0, 0);
    finder(size - 7, 0);
    finder(0, size - 7);

    for (let y = 7; y < 13; y += 1) {
      for (let x = 7; x < 13; x += 1) {
        modules[y][x] = false;
      }
    }

    target.innerHTML = modules
      .flat()
      .map((isDark) => `<span class="${isDark ? "is-dark" : ""}"></span>`)
      .join("");
  }

              ${renderSheetRole("student", "user", "学生端", "记录实践与查看成长画像")}
              ${renderSheetRole("teacher", "clipboard", "教师管理端", "材料研判与质性反馈")}
              ${renderSheetRole("college", "graduation", "院校管理端", "指标、规则与群体报告")}
            </div>
            <button class="ghost-button" type="button" data-nav="welcome" style="width:100%;margin-top:14px">${icon("home")} 返回启动欢迎页</button>
          </section>
        </div>
      `;
      requestAnimationFrame(() => modalRoot.querySelector(".sheet-close")?.focus());
      return;
    }

    if (state.modal === "tags") {
      const student = MATERIAL_ROWS.find((item) => item.id === state.modalStudentId);
      if (!student) {
        state.modal = null;
        modalRoot.innerHTML = "";
        return;
      }
      const allTags = [
        ...new Set([
          "创新意识与动机",
          "创新思维与方法",
          "创新精神与品格",
          "教学与教育实践创新",
          "课堂观察",
          "方案迭代",
          "尝试勇气",
          "协作表达",
          ...state.editingTags,
        ]),
      ];
      modalRoot.innerHTML = `
        <div class="modal-backdrop" data-close-modal>
          <section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="tag-sheet-title" data-sheet>
            <div class="bottom-sheet__head">
              <div>
                <h3 id="tag-sheet-title">修改标签建议</h3>
                <p>选择贴合材料的观察维度，也可以添加自定义标签。</p>
              </div>
              <button class="sheet-close" type="button" data-close-modal aria-label="关闭">${icon("close")}</button>
            </div>
            <div class="tag-editor__student">
              <span class="student-avatar student-avatar--photo">
                <img src="${student.portrait}" alt="${student.name}演示头像" />
              </span>
              <span><strong>${student.name} · ${student.type}</strong><span>${student.time} 提交</span></span>
            </div>
            <div class="tag-editor__section-title">四维指标与常用标签</div>
            <div class="tag-toggle-grid">
              ${allTags
                .map(
                  (tag) => `
                    <button class="tag-toggle${state.editingTags.includes(tag) ? " is-selected" : ""}" type="button" data-toggle-sheet-tag="${escapeHTML(tag)}">
                      ${escapeHTML(tag)}
                    </button>
                  `,
                )
                .join("")}
            </div>
            <div class="tag-editor__section-title">自定义标签</div>
            <div class="custom-tag-row">
              <input id="custom-tag-input" maxlength="16" placeholder="输入标签名称" aria-label="输入自定义标签" />
              <button class="outline-button" type="button" data-add-sheet-tag>${icon("plus")} 新增</button>
            </div>
            <div class="inline-note">
              ${icon("message")}
              <span>标签仅辅助材料研判，不作为评定依据。最终判断保留在教师专业研判中。</span>
            </div>
            <div class="sheet-actions">
              <button class="ghost-button" type="button" data-close-modal>取消</button>
              <button class="primary-button" type="button" data-save-sheet-tags>${icon("check")} 保存标签</button>
            </div>
          </section>
        </div>
      `;
      requestAnimationFrame(() => modalRoot.querySelector(".sheet-close")?.focus());
    }
  }

  function renderSheetRole(role, iconName, title, subtitle) {
    const isCurrent = PAGE_META[state.page]?.role === role;
    return `
      <button class="sheet-role${isCurrent ? " is-current" : ""}" type="button" data-switch-role="${role}">
        <span class="sheet-role__icon">${icon(iconName)}</span>
        <span><strong>${title}</strong><span>${subtitle}</span></span>
        ${isCurrent ? '<span class="sheet-role__current">当前</span>' : `<span class="menu-row__arrow">${icon("chevron-right")}</span>`}
      </button>
    `;
  }

  function go(page, { replace = false } = {}) {
    let normalized = normalizePage(page);
    if (normalized !== "welcome" && PAGE_META[normalized]?.role !== selectedRole) {
      normalized = "welcome";
    }
    if (normalized === "welcome") {
      clearSelectedRole();
    }
    state.page = normalized;
    state.modal = null;
    const hash = normalized === "welcome" ? "" : `#${normalized}`;
    syncLocation(hash, { replace });
    render();
    requestAnimationFrame(() => {
      const scroller = document.querySelector("#page-scroll");
      if (scroller) scroller.scrollTop = 0;
      buildQrCode();
    });
  }

  function syncLocation(hash, { replace = false } = {}) {
    if (location.hash === hash) return;

    const applyHashFallback = () => {
      suppressNextHashChange = true;
      try {
        location.hash = hash ? hash.slice(1) : "";
      } catch {
        // Rendering still proceeds when a browser forbids URL mutation.
      }
    };

    // Local HTML files commonly run in an opaque origin where History API
    // mutation is blocked. Hash-only navigation is the safest fallback.
    if (location.protocol === "file:") {
      applyHashFallback();
      return;
    }

    const target = hash || `${location.pathname}${location.search}`;
    try {
      if (replace) history.replaceState(null, "", target);
      else history.pushState(null, "", target);
    } catch {
      applyHashFallback();
    }
  }

  function showToast(message) {
    window.clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.add("is-visible");
    toastTimer = window.setTimeout(() => toastEl.classList.remove("is-visible"), 2600);
  }

  function openRoleSwitch() {
    state.modal = "role";
    renderModal();
  }

  function closeModal() {
    state.modal = null;
    renderModal();
  }

  function openTagEditor(studentId) {
    state.modalStudentId = studentId;
    state.editingTags = [...(state.studentTags[studentId] || [])];
    state.modal = "tags";
    renderModal();
  }

  document.addEventListener("click", (event) => {
    const nav = event.target.closest("[data-nav]");
    if (nav) {
      go(nav.dataset.nav);
      return;
    }

    const roleButton = event.target.closest("[data-switch-role]");
    if (roleButton) {
      const role = roleButton.dataset.switchRole;
      saveSelectedRole(role);
      go(ROLE_HOME[role]);
      return;
    }

    if (event.target.closest("[data-open-role]")) {
      openRoleSwitch();
      return;
    }

    const modalCloseTarget = event.target.closest("[data-close-modal]");
    if (
      modalCloseTarget &&
      (!modalCloseTarget.classList.contains("modal-backdrop") || event.target === modalCloseTarget)
    ) {
      closeModal();
      return;
    }

    const filter = event.target.closest("[data-resource-filter]");
    if (filter) {
      state.resourceFilter = filter.dataset.resourceFilter;
      render();
      return;
    }

    const demo = event.target.closest("[data-demo-message]");
    if (demo) {
      showToast(demo.dataset.demoMessage);
      return;
    }

    if (event.target.closest("[data-save-reflection]")) {
      const saved = saveState();
      showToast(
        saved
          ? "反思草稿已保存到当前浏览器"
          : "反思草稿已保留在当前页面；当前打开方式不支持持久保存",
      );
      return;
    }

    if (event.target.closest("[data-save-feedback]")) {
      const qualitative = document.querySelector("#qualitative-feedback")?.value.trim();
      const suggestion = document.querySelector("#development-suggestion")?.value.trim();
      if (!qualitative || !suggestion) {
        showToast("请先填写质性评语和发展改进建议");
        return;
      }
      showToast("反馈草稿已保存，未生成任何量化分数");
      return;
    }

    const quickFeedback = event.target.closest("[data-quick-feedback]");
    if (quickFeedback) {
      const target = document.querySelector(`#${quickFeedback.dataset.quickFeedback}`);
      if (target) {
        target.value = target.value.trim()
          ? `${target.value.trim()} ${quickFeedback.dataset.phrase}`
          : quickFeedback.dataset.phrase;
        target.focus();
      }
      return;
    }

    const tagEdit = event.target.closest("[data-edit-tags]");
    if (tagEdit) {
      openTagEditor(tagEdit.dataset.editTags);
      return;
    }

    const tagToggle = event.target.closest("[data-toggle-sheet-tag]");
    if (tagToggle) {
      const tag = tagToggle.dataset.toggleSheetTag;
      if (state.editingTags.includes(tag)) {
        state.editingTags = state.editingTags.filter((item) => item !== tag);
      } else {
        state.editingTags.push(tag);
      }
      renderModal();
      return;
    }

    if (event.target.closest("[data-add-sheet-tag]")) {
      const input = document.querySelector("#custom-tag-input");
      const value = input?.value.trim();
      if (!value) {
        showToast("请输入自定义标签");
        input?.focus();
        return;
      }
      if (!state.editingTags.includes(value)) state.editingTags.push(value);
      renderModal();
      requestAnimationFrame(() => {
        const nextInput = document.querySelector("#custom-tag-input");
        nextInput?.focus();
        showToast("已加入自定义标签，保存后生效");
      });
      return;
    }

    if (event.target.closest("[data-save-sheet-tags]")) {
      state.studentTags[state.modalStudentId] = [...state.editingTags];
      const saved = saveState();
      state.modal = null;
      render();
      showToast(persistenceMessage("标签建议"));
      return;
    }

    const indicatorToggle = event.target.closest("[data-toggle-indicator]");
    if (indicatorToggle) {
      const key = indicatorToggle.dataset.toggleIndicator;
      if (state.openIndicators.has(key)) state.openIndicators.delete(key);
      else state.openIndicators.add(key);
      render();
      return;
    }

    const removeIndicator = event.target.closest("[data-remove-indicator]");
    if (removeIndicator) {
      const key = removeIndicator.dataset.removeIndicator;
      const tag = removeIndicator.dataset.tag;
      state.indicatorTags[key] = state.indicatorTags[key].filter((item) => item !== tag);
      saveState();
      render();
      showToast("标签已从指标库移除");
      return;
    }

    const addIndicator = event.target.closest("[data-add-indicator]");
    if (addIndicator) {
      const key = addIndicator.dataset.addIndicator;
      const input = document.querySelector(`[data-indicator-input="${key}"]`);
      addIndicatorTag(key, input?.value);
      return;
    }

    if (event.target.closest("[data-save-indicators]")) {
      const saved = saveState();
      showToast(
        saved
          ? "四维指标库配置已保存"
          : "四维指标库配置已更新；当前打开方式不支持持久保存",
      );
      return;
    }

    const toggleRule = event.target.closest("[data-toggle-rule]");
    if (toggleRule) {
      const key = toggleRule.dataset.toggleRule;
      state.rules[key] = !state.rules[key];
      saveState();
      render();
      showToast(state.rules[key] ? "设置已开启" : "设置已关闭");
      return;
    }

    if (event.target.closest("[data-save-rules]")) {
      const saved = saveState();
      showToast(
        saved
          ? "规则设置已保存"
          : "规则设置已更新；当前打开方式不支持持久保存",
      );
      return;
    }

    if (event.target.closest("[data-export-report]")) {
      showToast("演示模式：PDF 导出接口暂未接入，报告数据仅作展示");
    }
  });

  document.addEventListener("input", (event) => {
    const reflection = event.target.closest("[data-reflection-index]");
    if (reflection) {
      const index = Number(reflection.dataset.reflectionIndex);
      state.reflection[index] = reflection.value;
      const counter = document.querySelector(`[data-reflection-count="${index}"]`);
      if (counter) counter.textContent = `${reflection.value.length} / 600`;
      window.clearTimeout(reflectSaveTimer);
      reflectSaveTimer = window.setTimeout(saveState, 500);
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && state.modal) {
      closeModal();
      return;
    }

    if (event.key === "Enter") {
      const indicatorInput = event.target.closest("[data-indicator-input]");
      if (indicatorInput) {
        event.preventDefault();
        addIndicatorTag(indicatorInput.dataset.indicatorInput, indicatorInput.value);
        return;
      }

      if (event.target.id === "custom-tag-input") {
        event.preventDefault();
        document.querySelector("[data-add-sheet-tag]")?.click();
      }
    }
  });

  function addIndicatorTag(key, rawValue) {
    const value = String(rawValue || "").trim();
    if (!value) {
      showToast("请输入要新增的标签");
      document.querySelector(`[data-indicator-input="${key}"]`)?.focus();
      return;
    }
    if (state.indicatorTags[key].includes(value)) {
      showToast("该标签已存在");
      return;
    }
    state.indicatorTags[key].push(value);
    state.openIndicators.add(key);
    saveState();
    render();
    requestAnimationFrame(() => {
      document.querySelector(`[data-indicator-input="${key}"]`)?.focus();
      showToast("标签已新增，点击底部按钮保存配置");
    });
  }

  window.addEventListener("hashchange", () => {
    if (suppressNextHashChange) {
      suppressNextHashChange = false;
      return;
    }
    const nextPage = normalizePage(location.hash.replace(/^#/, ""));
    if (nextPage !== "welcome" && PAGE_META[nextPage]?.role !== selectedRole) {
      go("welcome", { replace: true });
      return;
    }
    if (nextPage !== state.page) {
      state.page = nextPage;
      state.modal = null;
      render();
      requestAnimationFrame(() => {
        const scroller = document.querySelector("#page-scroll");
        if (scroller) scroller.scrollTop = 0;
        buildQrCode();
      });
    }
  });

  go(state.page, { replace: true });
  validatePrototype();

  function validatePrototype() {
    const missingPages = Object.keys(PAGE_META).filter(
      (page) => typeof {
        "student-home": renderStudentHome,
        "student-archive": renderStudentArchive,
        "student-profile": renderStudentProfile,
        "student-resources": renderStudentResources,
        "student-reflection": renderStudentReflection,
        "student-me": renderStudentMe,
        "teacher-home": renderTeacherHome,
        "teacher-materials": renderTeacherMaterials,
        "teacher-feedback": renderTeacherFeedback,
        "teacher-stats": renderTeacherStats,
        "college-home": renderCollegeHome,
        "college-indicators": renderCollegeIndicators,
        "college-rules": renderCollegeRules,
        "college-report": renderCollegeReport,
        qr: renderQrPage,
      }[page] !== "function",
    );
    if (missingPages.length) {
      console.warn("Unavailable prototype pages:", missingPages);
    }
  }
})();

</script>
