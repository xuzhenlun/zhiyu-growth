<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f9fd" />
    <meta
      name="description"
      content="智育成长画像平台：面向师范生的创新成长记录与反馈中心，连接学生、教师与院校的成长支持系统。"
    />
    <title>智育成长画像平台 · 师范生创新成长记录与反馈中心</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23eff6fd'/%3E%3Cpath d='M16 6c-4.5 2.3-7 6.2-7 11.4 0 3.4 2 6.2 5.1 7.4 1-2.9 2.4-6 4.4-8.9-1.7 3.3-2.6 6.6-2.8 9.4 1.9-.3 3.6-1.2 5-2.6 3.1-3.2 3.6-8.5 1.5-12.5-1.5-3-4.2-4.2-6.2-4.2Z' fill='%233b6fd4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-texture" aria-hidden="true"></div>

    <header class="app-header" id="appHeader" hidden>
      <div class="header-inner">
        <a class="brand" href="#/welcome" aria-label="返回欢迎页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M20 5.5c-7 3.4-10.9 9.4-10.9 17.3 0 5.3 3.1 9.8 8 11.7 1.5-4.7 3.8-9.5 6.9-13.8-2.8 5-4.2 10-4.6 14.3 3-.4 5.8-1.8 8-4 4.9-5 5.7-13.1 2.4-19.4C27.5 7.9 23.1 5.5 20 5.5Z" fill="currentColor"/>
              <path d="M20 23.5c3.4-2.6 6.2-3.9 9.5-4.2" stroke="#f8f4ea" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="brand-copy">
            <strong>智育成长画像</strong>
            <small>师范生创新成长记录与反馈中心</small>
          </span>
        </a>

        <nav class="main-nav" id="mainNav" aria-label="主导航"></nav>

        <div class="header-side">
          <span class="demo-badge"><i></i> 原型演示</span>
          <div class="role-switch" id="roleSwitch" aria-label="切换角色端">
            <button type="button" data-role="student">学生端</button>
            <button type="button" data-role="teacher">教师端</button>
            <button type="button" data-role="institution">院校端</button>
          </div>
          <button class="avatar" id="avatarBtn" type="button" aria-label="当前账号">林</button>
        </div>
      </div>
    </header>

    <main id="app" class="app" tabindex="-1"></main>

    <nav class="student-tabs" id="studentTabs" aria-label="学生端底部导航" hidden>
      <a href="#/student" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3.5 10.5 8.5-7 8.5 7"/><path d="M5.5 9v10.5h13V9"/><path d="M9.5 19.5v-6h5v6"/></svg>
        <span>首页</span>
      </a>
      <a href="#/student/archive" data-tab="archive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7.5h16v12H4z"/><path d="M3 4.5h18v3H3zM9 11.5h6"/></svg>
        <span>档案</span>
      </a>
      <a href="#/student/resources" data-tab="resources">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4.5h11a3 3 0 0 1 3 3v12H7.5A2.5 2.5 0 0 1 5 17V4.5Z"/><path d="M5 17a2.5 2.5 0 0 1 2.5-2.5H19M9 8h6"/></svg>
        <span>资源</span>
      </a>
      <a href="#/student/reflection" data-tab="me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.8-4 3.3-6 7-6s6.2 2 7 6"/></svg>
        <span>我的</span>
      </a>
    </nav>

    <footer class="site-footer" id="siteFooter">
      <span>师范生创新成长记录与反馈中心</span>
      <span class="footer-dot">·</span>
      <span>智育成长画像平台</span>
      <span class="footer-demo">原型演示 · 数据仅作产品展示</span>
    </footer>

    <div class="modal" id="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" type="button" data-close-modal aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div id="modalBody"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
